<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Logs — FonixFlow Splat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-2: rgba(255, 255, 255, 0.05);
            --surface-3: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #f4f4f5;
            --text-2: #a1a1aa;
            --text-3: #6b6b76;
            --accent: #818cf8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text-2);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 35% at 15% 0%, rgba(99, 102, 241, 0.10), transparent 60%),
                radial-gradient(ellipse 45% 35% at 85% 5%, rgba(236, 72, 153, 0.06), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            background: rgba(10, 10, 15, 0.78);
            backdrop-filter: saturate(160%) blur(18px);
            padding: 14px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            font-family: var(--font);
        }

        .header h1 {
            font-size: 1.05em;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 11px;
        }
        .header h1 .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.7);
            animation: pulse 1.4s ease-in-out infinite;
        }

        .header-buttons { display: flex; gap: 8px; }

        .header button {
            padding: 8px 14px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-2);
            border-radius: 11px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 0.82em;
            font-weight: 500;
            transition: all 0.18s ease;
        }
        .header button:hover {
            background: var(--surface-3);
            border-color: var(--border-strong);
            color: var(--text);
            transform: translateY(-1px);
        }
        .btn-clear:hover { border-color: rgba(248, 113, 113, 0.4) !important; color: var(--danger) !important; }
        .btn-scroll:hover { border-color: rgba(52, 211, 153, 0.4) !important; color: var(--success) !important; }

        .terminal {
            position: relative;
            z-index: 1;
            padding: 18px 32px;
            padding-bottom: 150px;  /* Extra space so last lines aren't covered by status bar */
            min-height: calc(100vh - 60px);
        }

        .log-entry {
            padding: 3px 2px;
            font-size: 0.8em;
            line-height: 1.55;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .log-entry:hover { background: rgba(255, 255, 255, 0.04); }

        .log-INFO    { color: #9ca3af; }
        .log-ERROR   { color: var(--danger); }
        .log-WARNING { color: var(--warning); }
        .log-DEBUG   { color: var(--text-3); }

        .timestamp { color: var(--text-3); }
        .level { font-weight: 600; }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.78);
            backdrop-filter: saturate(160%) blur(18px);
            padding: 11px 32px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82em;
            font-family: var(--font);
            z-index: 100;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.7);
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .log-count { color: var(--text-3); font-family: var(--mono); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
            font-size: 0.9em;
            font-family: var(--font);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="dot"></span>Live Logs</h1>
        <div class="header-buttons">
            <button class="btn-scroll" onclick="scrollToBottom()">Scroll to Bottom</button>
            <button class="btn-clear" onclick="clearLogs()">Clear Logs</button>
            <button class="btn-back" onclick="window.location.href='/'">← Back to App</button>
        </div>
    </div>

    <div class="terminal" id="terminal">
        <div class="empty-state" id="emptyState">
            Waiting for logs... Upload some images to see processing logs here.
        </div>
    </div>

    <div class="status-bar">
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Connected — live streaming</span>
        </div>
        <div class="log-count" id="logCount">0 log entries</div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const emptyState = document.getElementById('emptyState');
        const logCount = document.getElementById('logCount');
        let autoScroll = true;
        let entryCount = 0;

        // Load existing logs first
        async function loadExistingLogs() {
            try {
                const response = await fetch('/logs/current');
                const data = await response.json();
                if (data.logs && data.logs.length > 0) {
                    emptyState.style.display = 'none';
                    data.logs.forEach(log => addLogEntry(log));
                }
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        // Connect to SSE stream
        function connectStream() {
            const eventSource = new EventSource('/logs/stream');

            eventSource.onmessage = function(event) {
                emptyState.style.display = 'none';
                addLogEntry(event.data);
            };

            eventSource.onerror = function(error) {
                console.error('SSE Error:', error);
                // Reconnect after 2 seconds
                setTimeout(connectStream, 2000);
            };
        }

        function addLogEntry(logText) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            // Parse and colorize the log
            let colorClass = 'log-INFO';
            if (logText.includes('[ERROR]')) colorClass = 'log-ERROR';
            else if (logText.includes('[WARNING]')) colorClass = 'log-WARNING';
            else if (logText.includes('[DEBUG]')) colorClass = 'log-DEBUG';

            entry.classList.add(colorClass);
            entry.textContent = logText;

            terminal.appendChild(entry);
            entryCount++;
            logCount.textContent = `${entryCount} log entries`;

            if (autoScroll) {
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function clearLogs() {
            if (!confirm('Clear all logs?')) return;

            try {
                await fetch('/logs/clear', { method: 'POST' });
                terminal.innerHTML = '<div class="empty-state" id="emptyState">Logs cleared. Waiting for new logs...</div>';
                entryCount = 0;
                logCount.textContent = '0 log entries';
            } catch (error) {
                alert('Error clearing logs: ' + error);
            }
        }

        // Detect manual scroll to disable auto-scroll
        window.addEventListener('scroll', function() {
            const isAtBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 100;
            autoScroll = isAtBottom;
        });

        // Initialize
        loadExistingLogs();
        connectStream();
    </script>
</body>
</html>
